name: Suggest a resource
description: Suggest a resource for the computational neuroscience collection.
title: "[Resource]: "
labels:
  - resource suggestion
body:
  - type: markdown
    attributes:
      value: Please check the list for duplicates and review the contribution guidance before submitting.
  - type: input
    id: name
    attributes:
      label: Resource name
      placeholder: Name of the tool, course, book, dataset, or other resource
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      description: Prefer the official project or resource page.
      placeholder: https://example.org
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Suggested catalog page
      description: Choose the resource type, then name relevant topic, learning, or method guides in your description.
      options:
        - Books
        - Courses and lectures
        - Tutorials and examples
        - Papers and reviews
        - Software
        - Datasets and benchmarks
        - Standards
        - Community
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Short description
      description: What does it offer, who can use it (background or experience), and what can they learn or do? Name the catalog section and any guides that should link to the entry.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Access and prerequisites
      description: Can readers use the resource for free? Note accounts, agreements, paid access, required software, or substantial hardware requirements where relevant.
      placeholder: Free online materials; running the examples requires Python.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What did you verify?
      description: Link to official documentation or a sample lesson, give the date checked, and distinguish reading the page from running code or downloading data.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the list for duplicates and confirmed that this resource is relevant.
          required: true
